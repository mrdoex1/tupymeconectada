<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Tu Pyme Conectada</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      body {
        background: linear-gradient(180deg, #090d16 0%, #0d1322 100%);
        color: #f3f4f6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .error-card {
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        max-width: 480px;
        width: 100%;
        padding: 45px 32px;
        text-align: center;
      }

      .logo-img {
        height: 48px;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        margin-bottom: 25px;
      }

      .error-code {
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(135deg, #fff 20%, #00a3ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        margin-bottom: 12px;
      }

      .error-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .error-text {
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: 30px;
      }

      .error-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 30px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-home {
        background: #00a3ff;
        color: #000;
      }

      .btn-home:hover {
        background: #38bdf8;
        transform: translateY(-2px);
      }

      .btn-whatsapp {
        background: #25d366;
        color: #fff;
      }

      .btn-whatsapp:hover {
        background: #2ee06f;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <img
        src="/recursos/imagenes/logoTPC.png"
        alt="Logo Tu Pyme Conectada"
        class="logo-img"
      />
      <p class="error-code">404</p>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-text">
        La página que buscas no existe o fue movida.
        No te preocupes, podemos volver a tu sitio o conversar por WhatsApp.
      </p>
      <div class="error-buttons">
        <a href="/" class="btn btn-home">
          <i class="fa-solid fa-house"></i> Volver al inicio
        </a>
        <a
          href="https://wa.me/56959909150?text=Hola,%20me%20perdí%20en%20tu%20sitio%20web"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-whatsapp"
        >
          <i class="fa-brands fa-whatsapp"></i> Escríbeme por WhatsApp
        </a>
      </div>
    </div>
  </body>
</html>
