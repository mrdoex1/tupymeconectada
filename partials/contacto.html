<!-- SECCIÓN DE CONTACTO -->
    <section id="contacto" class="full-section">
      <div class="section-inner">
        <div class="section-header" style="margin-bottom: 50px">
          <div class="section-title-group">
            <span class="section-tag">04 // Conexión</span>
            <h2>Contacto</h2>
          </div>
        </div>
        <div class="contact-layout">
          <div class="contact-info">
            <p>
              Escríbenos directamente o déjanos tus datos en el formulario para
              conversar sobre tu próximo sitio web.
            </p>
            <ul class="contact-list">
              <li><a href="https://wa.me/56959909150?text=Hola,%20me%20gustaría%20más%20información" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i> +56 9 5990 9150</a></li>
              <li><a href="mailto:contacto@tupymeconectada.cl"><i class="fa-solid fa-envelope"></i> contacto@tupymeconectada.cl</a></li>
              <li><a href="https://www.instagram.com/tupymeconectada/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i> @tupymeconectada</a></li>
              <li><span class="contact-static"><i class="fa-solid fa-location-dot"></i> Disponibles para ayudarte no importa donde estés (Chile)</span></li>
            </ul>
          </div>
          <div class="contact-form">
            <form id="formContacto">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input
                  type="text"
                  id="nombre"
                  required
                  placeholder="Ingresa tu nombre"
                />
              </div>
              <div class="form-group">
                <label for="servicio">Servicio de interés</label>
                <select id="servicio" required>
                  <option value="" disabled selected>Selecciona una opción</option>
                  <option value="Landing Page Express (Independientes)">Landing Page Express (Independientes)</option>
                  <option value="Catálogo con Pedido a WhatsApp (Locales)">Catálogo con Pedido a WhatsApp (Locales)</option>
                  <option value="Sitio Web Corporativo (Empresas)">Sitio Web Corporativo (Empresas)</option>
                  <option value="Tienda Online Profesional (E-commerce)">Tienda Online Profesional (E-commerce)</option>
                </select>
              </div>
              <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea
                  id="mensaje"
                  required
                  placeholder="Cuéntanos qué necesitas..."
                ></textarea>
              </div>
              <button type="submit" class="form-btn">
                <i class="fa-brands fa-whatsapp" style="margin-right: 8px;"></i> Enviar consulta
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
