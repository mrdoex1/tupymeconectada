<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantilla Instagram Dinámica - Variante Espejo 1080x1440</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-surface: #f5f7fb;
      --bg-gradient-end: #eef4fb;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: rgba(15, 23, 42, 0.08);
      --blue-primary: #00a3ff;
      --blue-light: #38bdf8;
      --blue-glow: rgba(0, 163, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      padding: 20px;
    }

    /* Lienzo exacto para post de Instagram (1080x1440) */
    .post-canvas {
      width: 1080px;
      height: 1440px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    /* CAPAS Y FORMAS DIAGONALES EN EL FONDO */
    .bg-gradient-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(-135deg, var(--bg-main) 0%, var(--bg-gradient-end) 100%);
      z-index: 1;
    }

    .diagonal-shape-top {
      position: absolute;
      top: -120px;
      left: -100px;
      width: 650px;
      height: 650px;
      background: linear-gradient(-135deg, rgba(0, 163, 255, 0.08) 0%, rgba(56, 189, 248, 0.02) 100%);
      transform: rotate(-25deg);
      border-radius: 60px;
      border: 1px solid rgba(0, 163, 255, 0.15);
      z-index: 2;
    }

    .diagonal-stripe {
      position: absolute;
      top: 150px;
      left: -180px;
      width: 700px;
      height: 80px;
      background: linear-gradient(90deg, var(--blue-light), var(--blue-primary));
      transform: rotate(35deg);
      border-radius: 40px;
      opacity: 0.15;
      z-index: 2;
    }

    .diagonal-accent-bottom {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 550px;
      height: 550px;
      background: var(--text-primary);
      transform: rotate(-15deg);
      border-radius: 70px;
      z-index: 2;
    }

    .blue-glow-spot {
      position: absolute;
      top: 200px;
      left: 100px;
      width: 400px;
      height: 400px;
      background: var(--blue-glow);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    /* CONTENEDOR PRINCIPAL */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      padding: 70px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ENCABEZADO */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
    }

    .brand-logo {
      max-height: 76px;
      width: auto;
      object-fit: contain;
    }

    .badge {
      background: var(--text-primary);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 100px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
    }

    /* CUERPO PRINCIPAL: Ajustado para partir desde arriba */
    .main-body {
      flex: 1;
      display: flex;
      align-items: flex-start; /* El contenido parte desde arriba eliminando el espacio vacío superior */
      position: relative;
      padding-top: 140px; /* Margen superior controlado respecto al header */
    }

    /* SECCIÓN DE TEXTO (Más ancha y alta) */
    .text-container {
      width: 54%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 5;
    }

    .tag-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--blue-primary);
      font-weight: 800;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .tag-line::before {
      content: '';
      width: 28px;
      height: 4px;
      background: var(--blue-primary);
      border-radius: 2px;
    }

    .main-title {
      font-size: 76px; /* Título considerablemente más grande y de mayor impacto */
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.08;
      letter-spacing: -2px;
    }

    .main-title span {
      background: linear-gradient(135deg, var(--blue-primary), var(--blue-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 32px; /* Texto descriptivo más grande y legible */
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 600;
      max-width: 500px;
    }

    /* CONTENEDOR DEL MOCKUP FLOTANTE (CENTRADO A LA DERECHA) */
    .mockup-overlay {
      position: absolute;
      right: -40px;
      top: 15px; /* Ubicado de forma óptima acompañando al nuevo flujo superior */
      width: 620px;
      z-index: 15;
      pointer-events: none;
    }

    .mockup-overlay img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.25));
    }

    /* PIE DE PÁGINA */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 2px dashed rgba(15, 23, 42, 0.08);
      z-index: 20;
    }

    .social-handle {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .cta-button {
      background: linear-gradient(135deg, var(--blue-primary), #0082cc);
      color: #ffffff;
      padding: 16px 32px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(0, 163, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="post-canvas">
    <!-- ELEMENTOS DE FONDO DE TU MARCA -->
    <div class="bg-gradient-base"></div>
    <div class="diagonal-shape-top"></div>
    <div class="diagonal-stripe"></div>
    <div class="diagonal-accent-bottom"></div>
    <div class="blue-glow-spot"></div>

    <div class="content-wrapper">
      
      <header class="header">
        <div class="logo-wrapper">
          <img src="recursos/imagenes/logoTPC-dark.png" alt="Tu Logo" class="brand-logo">
        </div>
        <div class="badge">Destacado</div>
      </header>

      <main class="main-body">
        
        <div class="text-container">
          <span class="tag-line">Adaptabilidad total</span>
          <h1 class="main-title">
            Tu sitio web optimizado <span>para cualquier pantalla</span>
          </h1>
          <p class="description">
            Cada visita cuenta. Asegúrate de que tu negocio luzca impecable y funcione a la perfección sin importar si tus usuarios acceden desde un celular, una tablet o un computador de escritorio.
          </p>
        </div>

        <!-- ESPACIO PARA TU MOCKUP CON LA MANO (FORMATO PNG TRANSPARENTE) -->
  

      </main>

  

    </div>
  </div>

</body>
</html>
