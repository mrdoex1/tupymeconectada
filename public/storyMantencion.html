<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Mantenimiento Web - Final</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-gradient-end: #eef4fb;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --blue-primary: #00a3ff;
      --blue-light: #38bdf8;
      --blue-glow: rgba(0, 163, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background-color: #0f172a; padding: 20px;
    }

    /* Formato Historia: 1080x1920 */
    .post-canvas {
      width: 1080px; height: 1920px; background: #ffffff; position: relative;
      overflow: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    /* Elementos visuales (adaptados) */
    .bg-gradient-base { position: absolute; inset: 0; background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-gradient-end) 100%); z-index: 1; }
    .diagonal-shape-top { position: absolute; top: -100px; right: -50px; width: 800px; height: 800px; background: linear-gradient(135deg, rgba(0, 163, 255, 0.08) 0%, rgba(56, 189, 248, 0.02) 100%); transform: rotate(15deg); border-radius: 80px; z-index: 2; }
    .blue-glow-spot { position: absolute; top: 300px; left: -100px; width: 600px; height: 600px; background: var(--blue-glow); filter: blur(150px); border-radius: 50%; z-index: 2; }

    .content-wrapper { position: relative; z-index: 10; width: 100%; height: 100%; padding: 100px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo-container { height: 80px; }
    .logo-container img { height: 100%; width: auto; }
    
    .main-title { font-size: 80px; font-weight: 900; color: var(--text-primary); line-height: 1.1; letter-spacing: -2px; }
    .main-title span { background: linear-gradient(135deg, var(--blue-primary), var(--blue-light)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .intro-card { background: rgba(255, 255, 255, 0.9); border-left: 10px solid var(--blue-primary); padding: 40px; font-size: 36px; color: var(--text-secondary); line-height: 1.5; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

    .point-list { display: flex; flex-direction: column; gap: 30px; margin-top: 20px; }
    .point-item { display: flex; align-items: center; gap: 25px; font-size: 32px; font-weight: 600; color: var(--text-primary); background: #fff; padding: 20px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.05); }
    .point-icon { width: 50px; height: 50px; background: rgba(0, 163, 255, 0.1); color: var(--blue-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }

    .cta-container { margin-top: 60px; padding: 50px; background: var(--text-primary); border-radius: 25px; color: #ffffff; text-align: center; }
    .cta-text { font-size: 40px; font-weight: 800; }
  </style>
</head>
<body>

  <div class="post-canvas">
    <div class="bg-gradient-base"></div>
    <div class="diagonal-shape-top"></div>
    <div class="blue-glow-spot"></div>
    
    <div class="content-wrapper">
      <header class="header">
        <div class="logo-container"><img src="recursos/imagenes/logoTPC-dark.png" alt="Logo"></div>
      </header>
      
      <h1 class="main-title">¿Tu web <span>te da problemas</span>?</h1>
      
      <div class="intro-card">
        Yo me encargo de todo el mantenimiento técnico para que tú te enfoques en crecer.
      </div>
      
      <div class="point-list">
        <div class="point-item"><div class="point-icon">✓</div>Actualizaciones constantes</div>
        <div class="point-item"><div class="point-icon">✓</div>Seguridad y respaldos</div>
        <div class="point-item"><div class="point-icon">✓</div>Soporte técnico total</div>
      </div>

      <div class="cta-container">
        <div class="cta-text">¡Escríbeme "WEB" por DM! 🚀</div>
      </div>
    </div>
  </div>

</body>
</html>
