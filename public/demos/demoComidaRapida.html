<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger & Co. - Menú Virtual</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons (Versión 6.5.1 Actualizada) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #e84118;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-modal: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #2ed573;
            --accent-hover: #26af5f;
            --border: #334155;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 90px;
            min-height: 100vh;
        }

        /* Header Banner */
        .header {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.9) 100%), 
                        url('https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1200&q=80') center/cover;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            color: white;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .header-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            color: var(--text-main);
        }

        .header-info span {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .header-info i {
            color: var(--primary);
        }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Categories Bar */
        .categories-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .product-details {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .btn-add {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover {
            background: var(--primary);
            color: white;
        }

        /* Floating Cart Bar */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 500px;
            background: var(--primary);
            color: white;
            padding: 14px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.5);
            cursor: pointer;
            z-index: 99;
            transition: transform 0.2s;
        }

        .floating-cart:active {
            transform: translateX(-50%) scale(0.98);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-badge {
            background: white;
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .cart-action {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Drawer / Modal Cart */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-modal {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            max-height: 90vh;
            background: var(--bg-modal);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            transition: bottom 0.3s ease-out;
            z-index: 101;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        @media (min-width: 600px) {
            .cart-modal {
                max-width: 480px;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 24px;
                bottom: -100%;
            }
            .cart-modal.active {
                bottom: 50px;
            }
        }

        .cart-modal.active {
            bottom: 0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }

        .cart-items-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 14px;
            font-weight: 700;
        }

        .cart-item-price {
            font-size: 13px;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .qty-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .cart-summary {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .summary-row.total {
            color: var(--text-main);
            font-weight: 800;
            font-size: 18px;
            border-top: 1px dashed var(--border);
            padding-top: 8px;
            margin-bottom: 0;
        }

        /* Selector Delivery vs Retiro */
        .delivery-options {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .radio-label {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .radio-label input {
            accent-color: var(--primary);
        }

        .radio-label:has(input:checked) {
            border-color: var(--primary);
            background: rgba(255, 71, 87, 0.15);
        }

        /* Customer Form */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .btn-whatsapp {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .btn-whatsapp:hover {
            background: var(--accent-hover);
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="header-content">
            <div class="brand-logo">
                <i class="fa-solid fa-burger"></i>
            </div>
            <h1>BURGER & CO.</h1>
            <p>Sabor artesanal, directo a tu mesa.</p>
            <div class="header-info">
                <span><i class="fa-solid fa-clock"></i> 12:00 - 23:00 hrs</span>
                <span><i class="fa-solid fa-location-dot"></i> Av. Providencia 1234</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Categories Bar -->
        <nav class="categories-nav">
            <button class="cat-btn active" onclick="filterCategory('todos', event)">🔥 Todos</button>
            <button class="cat-btn" onclick="filterCategory('hamburguesas', event)">🍔 Hamburguesas</button>
            <button class="cat-btn" onclick="filterCategory('papas', event)">🍟 Papas & Acompañamientos</button>
            <button class="cat-btn" onclick="filterCategory('bebidas', event)">🥤 Bebidas</button>
        </nav>

        <!-- Product Sections -->
        <div id="menu-container">
            <!-- Dynamic Menu content rendered by JS -->
        </div>
    </main>

    <!-- Floating Cart Trigger -->
    <div class="floating-cart" id="floating-cart" onclick="openModal()" style="display: none;">
        <div class="cart-info">
            <div class="cart-badge" id="cart-count">0</div>
            <span>Ver Pedido</span>
        </div>
        <div class="cart-action">
            <span id="cart-total-float">$0</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
    
    <div class="cart-modal" id="cart-modal">
        <div class="modal-header">
            <h2>🛒 Tu Pedido</h2>
            <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items-list" id="cart-items">
            <!-- Cart Items rendered by JS -->
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">$0</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="cart-total">$0</span>
            </div>
        </div>

        <!-- Order Form -->
        <form id="order-form" onsubmit="sendWhatsAppOrder(event)">
            <!-- Selector Tipo de Entrega -->
            <div class="form-group">
                <label>Tipo de Entrega *</label>
                <div class="delivery-options">
                    <label class="radio-label">
                        <input type="radio" name="order-type" value="delivery" checked onchange="toggleDeliveryFields()"> 
                        🚚 Delivery
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="order-type" value="pickup" onchange="toggleDeliveryFields()"> 
                        🏪 Retiro en Tienda
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="cust-name">Tu Nombre *</label>
                <input type="text" id="cust-name" class="form-input" placeholder="Ej: Juan Pérez" required>
            </div>
            
            <!-- Campo Dirección (Se oculta dinámicamente) -->
            <div class="form-group" id="address-group">
                <label for="cust-address">Dirección de Entrega *</label>
                <input type="text" id="cust-address" class="form-input" placeholder="Ej: Av. Brasil 456, Depto 201" required>
            </div>

            <div class="form-group">
                <label for="cust-notes">Notas u Observaciones (Opcional)</label>
                <input type="text" id="cust-notes" class="form-input" placeholder="Ej: Sin cebolla, pagaré con transferencia">
            </div>

            <button type="submit" class="btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Enviar Pedido por WhatsApp
            </button>
        </form>
    </div>

    <!-- JavaScript logic -->
    <script>
        // CONFIGURACIÓN DEL NEGOCIO
        const PHONE_NUMBER = "56973173721"; // Tu número de WhatsApp con código de país (sin el +)

        // PRODUCTOS DE LA CARTA
        const products = [
            {
                id: 1,
                nombre: "Clásica Cheese",
                categoria: "hamburguesas",
                precio: 6900,
                descripcion: "180g de carne angus, queso cheddar doble, pepinillos y salsa de la casa en pan brioche.",
                imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                nombre: "Bacon Monster",
                categoria: "hamburguesas",
                precio: 8500,
                descripcion: "Doble carne 180g, abundante tocino ahumado, queso americano y salsa BBQ dulce.",
                imagen: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                nombre: "Veggie Avocado",
                categoria: "hamburguesas",
                precio: 7200,
                descripcion: "Medallón de garbanzos y lentejas, palta fresca, tomate, lechuga y mayonesa vegana.",
                imagen: "https://images.unsplash.com/photo-1525059696034-4967a8e1dca2?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                nombre: "Papas Fritas Rústicas",
                categoria: "papas",
                precio: 3200,
                descripcion: "Papas cortadas a mano con sal de mar y un toque de romero fresco.",
                imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                nombre: "Papas Cheddar & Bacon",
                categoria: "papas",
                precio: 4800,
                descripcion: "Papas rústicas bañadas en queso cheddar fundido y trozos de tocino crujiente.",
                imagen: "https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                nombre: "Coca-Cola Original 350ml",
                categoria: "bebidas",
                precio: 1500,
                descripcion: "Lata helada 350ml.",
                imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 7,
                nombre: "Cerveza IPA Artesanal",
                categoria: "bebidas",
                precio: 3800,
                descripcion: "Cerveza lata 473ml de la casa, notas cítricas e intensas.",
                imagen: "https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Estado del carrito (persistente en localStorage)
        let cart = JSON.parse(localStorage.getItem('burger_cart')) || [];

        // Formateador de moneda (Pesos chilenos)
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(amount);
        };

        // Renderizar Productos en pantalla
        function renderMenu(categoryFilter = 'todos') {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';

            const filtered = categoryFilter === 'todos' 
                ? products 
                : products.filter(p => p.categoria === categoryFilter);

            let html = `<div class="product-grid">`;
            
            filtered.forEach(prod => {
                html += `
                    <div class="product-card">
                        <img src="${prod.imagen}" alt="${prod.nombre}" class="product-img" loading="lazy">
                        <div class="product-details">
                            <h3 class="product-title">${prod.nombre}</h3>
                            <p class="product-desc">${prod.descripcion}</p>
                            <div class="product-bottom">
                                <span class="product-price">${formatMoney(prod.precio)}</span>
                                <button class="btn-add" onclick="addToCart(${prod.id})">
                                    <i class="fa-solid fa-plus"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            menuContainer.innerHTML = html;
        }

        // Filtrar categorías
        function filterCategory(category, evt) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(evt && evt.target) evt.target.classList.add('active');
            renderMenu(category);
        }

        // Funciones del Carrito
        function addToCart(productId) {
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.cantidad += 1;
            } else {
                const prod = products.find(p => p.id === productId);
                cart.push({ ...prod, cantidad: 1 });
            }
            saveAndRenderCart();
        }

        function changeQuantity(productId, delta) {
            const itemIndex = cart.findIndex(item => item.id === productId);
            if (itemIndex > -1) {
                cart[itemIndex].cantidad += delta;
                if (cart[itemIndex].cantidad <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            saveAndRenderCart();
        }

        function saveAndRenderCart() {
            localStorage.setItem('burger_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const floatingCart = document.getElementById('floating-cart');
            const cartCount = document.getElementById('cart-count');
            const cartTotalFloat = document.getElementById('cart-total-float');
            const cartSubtotal = document.getElementById('cart-subtotal');
            const cartTotal = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.cantidad, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            // Actualizar Floating Bar
            if (totalCount > 0) {
                floatingCart.style.display = 'flex';
                cartCount.innerText = totalCount;
                cartTotalFloat.innerText = formatMoney(totalPrice);
            } else {
                floatingCart.style.display = 'none';
                closeModal();
            }

            // Actualizar Modal
            cartSubtotal.innerText = formatMoney(totalPrice);
            cartTotal.innerText = formatMoney(totalPrice);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="empty-cart-msg">Tu carrito está vacío 🍔</p>`;
                return;
            }

            let html = '';
            cart.forEach(item => {
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.nombre}</div>
                            <div class="cart-item-price">${formatMoney(item.precio * item.cantidad)}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span style="font-size:13px; font-weight:700;">${item.cantidad}</span>
                            <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            cartItemsContainer.innerHTML = html;
        }

        // Mostrar u ocultar dirección según Delivery o Retiro
        function toggleDeliveryFields() {
            const orderType = document.querySelector('input[name="order-type"]:checked').value;
            const addressGroup = document.getElementById('address-group');
            const addressInput = document.getElementById('cust-address');

            if (orderType === 'pickup') {
                addressGroup.style.display = 'none';
                addressInput.removeAttribute('required');
                addressInput.value = '';
            } else {
                addressGroup.style.display = 'block';
                addressInput.setAttribute('required', 'true');
            }
        }

        // Modales
        function openModal() {
            document.getElementById('modal-overlay').classList.add('active');
            document.getElementById('cart-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            document.getElementById('cart-modal').classList.remove('active');
        }

        // Enviar pedido a WhatsApp
        function sendWhatsAppOrder(event) {
            event.preventDefault();

            if (cart.length === 0) return;

            const orderType = document.querySelector('input[name="order-type"]:checked').value;
            const isDelivery = orderType === 'delivery';

            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;
            const notes = document.getElementById('cust-notes').value;

            // Formato del mensaje para WhatsApp
            let message = `🍔 *NUEVO PEDIDO - BURGER & CO.*\n\n`;
            message += `📌 *Tipo:* ${isDelivery ? '🚚 DELIVERY' : '🏪 RETIRO EN TIENDA'}\n`;
            message += `👤 *Cliente:* ${name}\n`;
            
            if (isDelivery) {
                message += `📍 *Dirección:* ${address}\n`;
            }
            
            if (notes) {
                message += `📝 *Notas:* ${notes}\n`;
            }

            message += `-----------------------------------\n`;

            let total = 0;
            cart.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                message += `• ${item.cantidad}x ${item.nombre} (${formatMoney(subtotal)})\n`;
            });

            message += `-----------------------------------\n`;
            message += `💰 *TOTAL A PAGAR:* ${formatMoney(total)}\n\n`;
            message += `¡Quedo a la espera de confirmación! 🙌`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${PHONE_NUMBER}&text=${encodedMessage}`;

            // Limpiar carrito tras pedir
            cart = [];
            saveAndRenderCart();

            // Redirigir a WhatsApp
            window.open(whatsappUrl, '_blank');
        }

        // Inicializar
        renderMenu();
        updateCartUI();
    </script>
</body>
</html>
