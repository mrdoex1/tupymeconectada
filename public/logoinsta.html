<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantilla Foto de Perfil / Logo Instagram (1:1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

  <style>
    :root {
      --bg-main: #ffffff;
      --bg-gradient-end: #edf4fc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: rgba(15, 23, 42, 0.08);
      --blue-primary: #00a3ff;
      --blue-light: #38bdf8;
      --blue-glow: rgba(0, 163, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .gallery-title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      color: #f8fafc;
    }

    .gallery-title span {
      color: var(--blue-light);
    }

    /* BOTÓN DE DESCARGA */
    .download-btn {
      background: linear-gradient(135deg, var(--blue-light), var(--blue-primary));
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 163, 255, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 163, 255, 0.5);
    }

    /* CONTENEDOR ESCALADO PARA PREVISUALIZACIÓN */
    .preview-container {
      width: 540px;
      height: 540px;
      position: relative;
    }

    /* LIENZO REAL (1080 x 1080) ESCALADO A 0.5 */
    .profile-canvas {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      border-radius: 32px;
      transform: scale(0.5);
      transform-origin: 0 0;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    /* FONDO DE MARCA */
    .bg-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-gradient-end) 100%);
      z-index: 1;
    }

    .blue-glow-spot-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 750px;
      background: var(--blue-glow);
      filter: blur(140px);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    .diagonal-shape-top {
      position: absolute;
      top: -120px;
      left: -120px;
      width: 650px;
      height: 400px;
      background: var(--text-primary);
      transform: rotate(-12deg);
      border-radius: 40px;
      z-index: 2;
    }

    .diagonal-shape-bottom {
      position: absolute;
      bottom: -120px;
      right: -120px;
      width: 550px;
      height: 350px;
      background: rgba(15, 23, 42, 0.05);
      transform: rotate(-12deg);
      border-radius: 40px;
      z-index: 2;
    }

    /* ESTRUCTURA Y ALINEACIÓN 100% CENTRADA */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* MARCO CIRCULAR PERFECTAMENTE CENTRADO */
    .avatar-ring-outer {
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: var(--blue-primary);
      border: 14px solid var(--blue-light);
      box-shadow: 0 20px 50px rgba(0, 163, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-ring-inner {
      width: 648px;
      height: 648px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 8px solid #ffffff;
      flex-shrink: 0;
    }

    /* ESPACIO PARA EL LOGOTIPO */
    .logo-target-area {
      width: 82%;
      height: 82%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-target-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* PLACEHOLDER VISUAL */
    .logo-placeholder-text {
      font-size: 60px;
      font-weight: 900;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: -1px;
      text-align: center;
      line-height: 1.1;
    }

    .logo-placeholder-text span {
      color: var(--blue-primary);
      display: block;
      font-size: 30px;
      letter-spacing: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1 class="gallery-title">Plantilla Foto de Perfil Instagram • <span>1080 x 1080 px</span></h1>

  <button class="download-btn" onclick="descargarImagen()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Descargar Imagen Centrada (1080x1080)
  </button>

  <div class="preview-container">
    <div class="profile-canvas" id="profile-canvas">
      <div class="bg-base"></div>
      <div class="diagonal-shape-top"></div>
      <div class="diagonal-shape-bottom"></div>



    </div>
  </div>

  <script>
    function descargarImagen() {
      const elemento = document.getElementById('profile-canvas');

      const transformOriginal = elemento.style.transform;
      const originOriginal = elemento.style.transformOrigin;

      elemento.style.transform = 'none';

      domtoimage.toPng(elemento, {
        width: 1080,
        height: 1080,
        style: {
          transform: 'none',
          'transform-origin': '0 0'
        }
      })
      .then(function (dataUrl) {
        elemento.style.transform = transformOriginal;
        elemento.style.transformOrigin = originOriginal;

        const link = document.createElement('a');
        link.download = 'foto-perfil-instagram.png';
        link.href = dataUrl;
        link.click();
      })
      .catch(function (error) {
        console.error('Error al generar la imagen:', error);
        elemento.style.transform = transformOriginal;
        elemento.style.transformOrigin = originOriginal;
      });
    }
  </script>

</body>
</html>
