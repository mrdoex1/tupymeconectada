  <style>
    :root {
      --bg-main: #ffffff;
      --bg-gradient-end: #edf4fc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: rgba(15, 23, 42, 0.08);
      --blue-primary: #00a3ff;
      --blue-light: #38bdf8;
      --blue-glow: rgba(0, 163, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .gallery-title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      color: #f8fafc;
    }

    .gallery-title span {
      color: var(--blue-light);
    }

    /* GRILLA DE ICONOS */
    .icons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1300px;
      justify-items: center;
    }

    /* CARD DE CADA ICONO */
    .icon-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 320px;
    }

    .icon-label {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
    }

    /* CONTENEDOR ESCALADO DE PREVISUALIZACIÓN */
    .preview-container {
      width: 250px;
      height: 250px;
      position: relative;
    }

    /* LIENZO REAL (1080 x 1080) ESCALADO PARA PANTALLA */
    .highlight-canvas {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      transform: scale(0.23148148);
      transform-origin: 0 0;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* FONDO DE MARCA */
    .bg-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-gradient-end) 100%);
      z-index: 1;
    }

    .blue-glow-spot-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 750px;
      height: 750px;
      background: var(--blue-glow);
      filter: blur(140px);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    .diagonal-shape-top {
      position: absolute;
      top: -120px;
      left: -120px;
      width: 650px;
      height: 400px;
      background: var(--text-primary);
      transform: rotate(-12deg);
      border-radius: 40px;
      z-index: 2;
    }

    .diagonal-shape-bottom {
      position: absolute;
      bottom: -120px;
      right: -120px;
      width: 550px;
      height: 350px;
      background: rgba(15, 23, 42, 0.05);
      transform: rotate(-12deg);
      border-radius: 40px;
      z-index: 2;
    }

    /* CONTENIDO TOTALMENTE CENTRADO */
    .content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* MARCO CIRCULAR EXACTO */
    .avatar-ring-outer {
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: var(--blue-primary);
      border: 14px solid var(--blue-light);
      box-shadow: 0 20px 50px rgba(0, 163, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-ring-inner {
      width: 648px;
      height: 648px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 8px solid #ffffff;
      flex-shrink: 0;
    }

    /* SVG DEL ICONO DENTRO DEL CÍRCULO */
    .icon-svg-wrapper {
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .icon-svg-wrapper svg {
      width: 100%;
      height: 100%;
    }

    /* BOTÓN DE DESCARGA */
    .download-btn {
      background: linear-gradient(135deg, var(--blue-light), var(--blue-primary));
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 163, 255, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0, 163, 255, 0.5);
    }
  </style>
</head>

  <script>
    function descargarHighlight(idElemento, nombreArchivo) {
      const elemento = document.getElementById(idElemento);

      const transformOriginal = elemento.style.transform;
      const originOriginal = elemento.style.transformOrigin;

      elemento.style.transform = 'none';

      domtoimage.toPng(elemento, {
        width: 1080,
        height: 1080,
        style: {
          transform: 'none',
          'transform-origin': '0 0'
        }
      })
      .then(function (dataUrl) {
        elemento.style.transform = transformOriginal;
        elemento.style.transformOrigin = originOriginal;

        const link = document.createElement('a');
        link.download = nombreArchivo;
        link.href = dataUrl;
        link.click();
      })
      .catch(function (error) {
        console.error('Error al generar la imagen:', error);
        elemento.style.transform = transformOriginal;
        elemento.style.transformOrigin = originOriginal;
      });
    }
  </script>
